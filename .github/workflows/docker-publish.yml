name: Publish container image

# Build the app image and push it to the GitHub Container Registry (GHCR)
# so it can be pulled and run anywhere without a source checkout or local build.
#   - on every push to main          -> tags :latest and :sha-<short>
#   - on a version tag (v1.2.3)      -> tags :1.2.3, :1.2, :latest
#   - manually via the Actions tab   -> workflow_dispatch
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Must be lowercase for GHCR (the GitHub owner is TheoLawrence86).
  IMAGE_NAME: theolawrence86/100k
  # Run JS actions on Node 24 (Node 20 is deprecated on GitHub runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Publish for both Intel/cloud hosts and Apple Silicon.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Point the Azure Web App at the freshly pushed sha tag so it re-pulls.
  # Auth is OIDC (federated credential on the gh-100k-deploy app registration,
  # Website Contributor on rg-100k-prod only) — no stored Azure secrets.
  deploy-azure:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update web app image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          az webapp config container set \
            --name tpu-100k --resource-group rg-100k-prod \
            --container-image-name ghcr.io/${{ env.IMAGE_NAME }}:sha-$SHORT_SHA
          az webapp restart --name tpu-100k --resource-group rg-100k-prod
