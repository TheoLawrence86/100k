services:
  app:
    build:
      context: .
      args:
        # Override locally with `GIT_SHA=$(git rev-parse --short HEAD) docker compose up --build`.
        GIT_SHA: ${GIT_SHA:-dev}
    # Name the locally built image after the GHCR repo so `docker compose push`
    # publishes it and `docker compose pull` fetches the same tag. Local
    # `docker compose up --build` still builds from source.
    image: ghcr.io/theolawrence86/100k:latest
    ports:
      - "8000:8000"
    environment:
      # Keep the SQLite file on a named volume so logged progress survives
      # container rebuilds and restarts.
      DB_PATH: /app/dbdata/coach.db
    volumes:
      - coach-db:/app/dbdata

volumes:
  coach-db:
